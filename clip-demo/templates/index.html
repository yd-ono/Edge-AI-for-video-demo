<!DOCTYPE html>
<html>
<head>
    <title>CLIP分類アプリ</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="controls">
        <div class="form-group">
            <label for="labels">検出ラベル (カンマ区切り):</label>
            <input type="text" id="labels" class="form-control" value="{{ labels }}">
        </div>
        <div class="status" id="status"></div>
    </div>
    
    <div class="container">        
        <div class="video-container">
            <img src="/video_feed" id="video" alt="ビデオストリーム">
        </div>
    </div>

    <script>
        const inputField = document.getElementById('labels');
        const status = document.getElementById('status');
        let timeout = null;
    
        inputField.addEventListener('input', () => {
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                const labels = inputField.value;
                fetch('/set_labels', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ labels: labels }),
                }).then(response => response.json())
                  .then(data => {
                    status.textContent = 'ラベル更新: ' + data.labels.join(', ');
                    status.style.color = 'green';
                    setTimeout(() => status.textContent = '', 2000);
                  }).catch(error => {
                    status.textContent = 'エラー: ' + error.message;
                    status.style.color = 'red';
                  });
            }, 1000);  // 1秒後に反映
        });
    </script>
</body>
</html>
