<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet Map Click Coordinates Demo(V3)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        #map {
            height: 100vh; /* ビューポート全体を使用 */
        }
        #coordinates {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            z-index: 1000; /* 地図より上に表示 */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        #division {
            position: absolute;
            top: 10px;
            left: 10px;
            background: white;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            font-size: 36px;
            z-index: 1000; /* 地図より上に表示 */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        .leaflet-left .leaflet-control-zoom {
            top: 50%; /* 垂直方向の中央 */
            transform: translateY(-50%); /* 中央に配置するための調整 */
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="coordinates">Clicked Location: N/A</div>
    <div id="division">師団 COP(v1)</div> 
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="/config.js"></script>
    <script src="app.js"></script>
</body>
</html>
